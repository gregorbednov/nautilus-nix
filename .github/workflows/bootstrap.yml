name: Bootstrap Nix locks and verify packages

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v32
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate input lock
        run: |
          nix flake lock
          git add flake.lock
      - name: Resolve Go module hashes
        shell: bash
        run: |
          for package in naut upstream; do
            key="$(nix eval --raw ".#$package.goInputsKey")"
            if jq -e --arg key "$key" 'has($key)' vendor-hashes.json >/dev/null; then
              continue
            fi
            log="$(mktemp)"
            if nix build --no-link --print-build-logs ".#$package.goModules" >"$log" 2>&1; then
              cat "$log"
              echo "Expected a hash mismatch for the unregistered Go module cache" >&2
              exit 1
            fi
            hash="$(sed -nE 's/^[[:space:]]*got:[[:space:]]+(sha256-[A-Za-z0-9+/=]+).*/\1/p' "$log" | tail -1)"
            if [[ -z "$hash" ]]; then
              cat "$log"
              exit 1
            fi
            jq --arg key "$key" --arg hash "$hash" '. + {($key): $hash}' vendor-hashes.json > hashes.tmp
            mv hashes.tmp vendor-hashes.json
          done
      - name: Build and smoke-test both branches and the source override
        shell: bash
        run: |
          nix flake check --print-build-logs
          omron="$(nix build .#naut --no-link --print-out-paths)"
          "$omron/bin/naut" --help | grep -F 'naut omron'
          rev="$(jq -r '.nodes["nautilus-upstream"].locked.rev' flake.lock)"
          nix run .#naut --override-input nautilus "github:joyautomation/nautilus/$rev" -- --version
      - uses: actions/upload-artifact@v4
        with:
          name: nautilus-nix-locks
          path: |
            flake.lock
            vendor-hashes.json
